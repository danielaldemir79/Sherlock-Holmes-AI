# Node.js with React, vite and yarn
# Build a Node.js project that uses React, vite and yarn.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  projectFolder: '.'
  buildOutputFolder: 'dist'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'
  
- task: YarnInstaller@3
  displayName: 'Install yarn 1.x'
  inputs:
    versionSpec: '1.x'
    checkLatest: 

    
- task: DownloadSecureFile@1
  inputs:
    secureFile: '.env'

# Copy the .env file
- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Agent.TempDirectory)'
    contents: '**/*.env'
    targetFolder: '$(projectFolder)'
    cleanTargetFolder: false

- script: |
    yarn install
    yarn run build
  displayName: 'yarn install and build'

- task: Yarn@3
  displayName: 'Build'
  inputs:
    arguments: 'run build'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: './dist'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: share'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    ArtifactName: chatgpt

